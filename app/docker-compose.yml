services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dokocr
      POSTGRES_USER: dokocr
      POSTGRES_PASSWORD: dokocr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokocr -d dokocr"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - document-storage:/data/storage
      - ./consume:/data/consume
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - document-storage:/data/storage
      - ./consume:/data/consume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --queues=ocr,metadata,maintenance
      --concurrency=${OCR_WORKER_CONCURRENCY:-1}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}

  worker-metadata:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - document-storage:/data/storage
      - ./consume:/data/consume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --queues=metadata
      --concurrency=${METADATA_WORKER_CONCURRENCY:-2}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}

  worker-maintenance:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - document-storage:/data/storage
      - ./consume:/data/consume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --queues=maintenance
      --concurrency=${MAINTENANCE_WORKER_CONCURRENCY:-1}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}

  worker-beat:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - document-storage:/data/storage
      - ./consume:/data/consume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  document-storage:
