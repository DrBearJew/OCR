<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Dok OCR feature map">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <style>
      .h{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .t{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .label{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .box{fill:#ffffff;stroke:#dbeafe;stroke-width:2}
      .muted{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .arrow{stroke:#0891b2;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/></marker>
  </defs>
  <rect width="1100" height="520" rx="26" fill="#f8fafc"/>
  <text x="50" y="58" class="h">Dok OCR workflow map</text>
  <text x="50" y="84" class="muted">From raw files to searchable, reviewed records.</text>

  <g transform="translate(50 125)">
    <rect class="box" width="180" height="100" rx="18"/>
    <circle cx="38" cy="36" r="20" fill="url(#blue)"/>
    <text x="29" y="43" font-size="24">📥</text>
    <text x="70" y="38" class="h" font-size="19">Intake</text>
    <text x="24" y="72" class="t">uploads</text>
    <text x="92" y="72" class="t">folders</text>
  </g>
  <path class="arrow" d="M245 175 H310"/>
  <g transform="translate(325 125)">
    <rect class="box" width="180" height="100" rx="18"/>
    <circle cx="38" cy="36" r="20" fill="url(#green)"/>
    <text x="27" y="43" font-size="24">👁️</text>
    <text x="70" y="38" class="h" font-size="19">OCR</text>
    <text x="24" y="72" class="t">PaddleVL</text>
    <text x="105" y="72" class="t">PP-OCRv6</text>
  </g>
  <path class="arrow" d="M520 175 H585"/>
  <g transform="translate(600 125)">
    <rect class="box" width="205" height="100" rx="18"/>
    <circle cx="38" cy="36" r="20" fill="url(#blue)"/>
    <text x="27" y="43" font-size="24">🧠</text>
    <text x="70" y="38" class="h" font-size="19">Extract</text>
    <text x="24" y="72" class="t">metadata</text>
    <text x="110" y="72" class="t">titles</text>
  </g>
  <path class="arrow" d="M820 175 H885"/>
  <g transform="translate(900 125)">
    <rect class="box" width="150" height="100" rx="18"/>
    <circle cx="38" cy="36" r="20" fill="url(#green)"/>
    <text x="27" y="43" font-size="24">🔎</text>
    <text x="70" y="38" class="h" font-size="19">Find</text>
    <text x="24" y="72" class="t">search</text>
    <text x="82" y="72" class="t">review</text>
  </g>

  <g transform="translate(80 295)">
    <rect width="270" height="145" rx="22" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="26" y="42" class="h">⚡ Smart stack</text>
    <text x="26" y="75" class="t">One command installs gateway assets,</text>
    <text x="26" y="98" class="t">PaddleVL template, and model preset.</text>
    <text x="26" y="124" class="muted">Admin → Model Setup → Test → Save</text>
  </g>
  <g transform="translate(415 295)">
    <rect width="270" height="145" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="26" y="42" class="h">🛡️ Private by design</text>
    <text x="26" y="75" class="t">Run on your infrastructure with</text>
    <text x="26" y="98" class="t">PostgreSQL, file storage, and workers.</text>
    <text x="26" y="124" class="muted">You choose where models run.</text>
  </g>
  <g transform="translate(750 295)">
    <rect width="270" height="145" rx="22" fill="#f0fdf4" stroke="#86efac"/>
    <text x="26" y="42" class="h">✅ Reviewable</text>
    <text x="26" y="75" class="t">Every document keeps events, states,</text>
    <text x="26" y="98" class="t">OCR text, metadata, and retry paths.</text>
    <text x="26" y="124" class="muted">No silent black box pipeline.</text>
  </g>
</svg>
