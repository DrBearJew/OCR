<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Dok OCR private document intelligence cockpit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.45" stop-color="#0f2336"/>
      <stop offset="1" stop-color="#123d46"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 54px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1.5px}
      .sub{font:500 22px Inter,Segoe UI,Arial,sans-serif;fill:#b6d3df}
      .small{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#d8f7ff}
      .tiny{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#9fc5d0}
      .card{fill:rgba(15,23,42,.72);stroke:rgba(94,234,212,.42);stroke-width:1.2}
      .doc{fill:#f8fafc;stroke:#7dd3fc;stroke-width:2}
      .line{stroke:#2dd4bf;stroke-width:3;stroke-linecap:round;opacity:.8}
    </style>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="160" fill="#14b8a6" opacity=".12" filter="url(#glow)"/>
  <circle cx="260" cy="360" r="190" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>

  <text x="70" y="92" class="title">Dok OCR</text>
  <text x="70" y="132" class="sub">Private document OCR, metadata, review, and search.</text>

  <g transform="translate(70 178)">
    <rect class="card" width="190" height="88" rx="18"/>
    <text x="22" y="34" class="small">📥 Upload</text>
    <text x="22" y="58" class="tiny">PDFs, scans, images</text>
  </g>
  <path class="line" d="M270 222 H330"/>
  <g transform="translate(340 178)">
    <rect class="card" width="190" height="88" rx="18"/>
    <text x="22" y="34" class="small">👁️ OCR</text>
    <text x="22" y="58" class="tiny">PaddleVL or PP-OCRv6</text>
  </g>
  <path class="line" d="M540 222 H600"/>
  <g transform="translate(610 178)">
    <rect class="card" width="210" height="88" rx="18"/>
    <text x="22" y="34" class="small">🧠 Metadata</text>
    <text x="22" y="58" class="tiny">titles, fields, records</text>
  </g>
  <path class="line" d="M830 222 H890"/>
  <g transform="translate(900 178)">
    <rect class="card" width="220" height="88" rx="18"/>
    <text x="22" y="34" class="small">🔎 Search</text>
    <text x="22" y="58" class="tiny">reviewable archive</text>
  </g>

  <g transform="translate(80 310)">
    <rect width="150" height="38" rx="19" fill="url(#teal)" opacity=".95"/>
    <text x="22" y="25" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="800" fill="#04111f">Self-hosted</text>
  </g>
  <g transform="translate(250 310)">
    <rect width="190" height="38" rx="19" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.16)"/>
    <text x="22" y="25" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#d8f7ff">German / English UI</text>
  </g>
  <g transform="translate(460 310)">
    <rect width="210" height="38" rx="19" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.16)"/>
    <text x="22" y="25" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#d8f7ff">One-click smart stack</text>
  </g>

  <g transform="translate(900 42)">
    <rect class="doc" x="0" y="0" width="82" height="106" rx="10" opacity=".95"/>
    <path d="M18 28h46M18 46h35M18 64h46M18 82h28" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <rect x="46" y="-8" width="82" height="106" rx="10" fill="#e0f2fe" stroke="#22d3ee" stroke-width="2" opacity=".92"/>
    <path d="M64 20h46M64 38h35M64 56h46M64 74h28" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <circle cx="126" cy="100" r="32" fill="url(#purple)" filter="url(#glow)"/>
    <text x="111" y="110" font-family="Inter,Segoe UI,Arial" font-size="32">✓</text>
  </g>
</svg>
